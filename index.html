// ─── DATE HELPERS ──────────────────────────────────────────────────────────
const nowISO = () => new Date().toISOString();
const hoursAgo = (h) => new Date(Date.now()-h*3600000).toISOString();
const todayStr = () => new Date().toISOString().split("T")[0];
const fmtDDMMYYYY = (iso) => { if(!iso)return"—"; const d=new Date(iso); return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`; };
const addWorkingDays = (fromDate, days) => { const d=new Date(fromDate);let added=0;while(added<days){d.setDate(d.getDate()+1);const dow=d.getDay();if(dow!==0&&dow!==6)added++;}return d.toISOString().split("T")[0]; };
const findRelanceSlot = (appts, targetDate) => { const BASE_H=9,BASE_M=30;const existing=appts.filter(a=>a.date===targetDate&&a.isRelance).map(a=>a.time);let h=BASE_H,m=BASE_M;for(let i=0;i<24;i++){const t=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;if(!existing.includes(t))return t;m+=5;if(m>=60){h++;m-=60;}}return"09:30"; };
const MONTHS = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
const fmtDate = (d) => { if(!d)return{day:"—",month:"",full:""};const[y,mo,day]=d.split("-");return{day:parseInt(day),month:MONTHS[parseInt(mo)-1],full:`${parseInt(day)} ${MONTHS[parseInt(mo)-1]} ${y}`}; };
const hoursSince = (iso) => iso?(Date.now()-new Date(iso).getTime())/3600000:0;
const daysSince  = (iso) => iso?(Date.now()-new Date(iso).getTime())/86400000:0;
const isToday = (dateStr) => dateStr===todayStr();

// ─── CSS ───────────────────────────────────────────────────────────────────
const CSS = `@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#EEF3F8;--surface:#fff;--surface2:#F5F8FC;
  --border:#DDE5EF;--border2:#C8D6E8;
  --text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --accent:#2BAAE0;--accent-d:#1A8FBF;--accent-l:#E0F4FC;--accent-l2:#C5EBFA;
  --green:#10B981;--green-bg:#D1FAE5;
  --red:#EF4444;--red-bg:#FEE2E2;--red-l:#FFF5F5;
  --orange:#F59E0B;--orange-bg:#FEF3C7;--orange-l:#FFFBEB;
  --purple:#8B5CF6;--purple-bg:#EDE9FE;
  --sh:0 2px 12px rgba(43,170,224,.08);--sh-md:0 4px 24px rgba(43,170,224,.13);--sh-lg:0 8px 40px rgba(0,0,0,.12);
}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif;font-size:14px;line-height:1.5;}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sb{width:232px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;box-shadow:2px 0 16px rgba(0,0,0,.04);}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-logo{width:38px;height:38px;background:var(--accent);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(43,170,224,.35);}
.sb-name{font-weight:800;font-size:17px;color:var(--text);letter-spacing:-.02em;}
.sb-sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.05em;}
.sb-nav{padding:12px 10px 8px;flex:1;overflow-y:auto;}
.sb-lbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin-bottom:4px;margin-top:10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text2);cursor:pointer;transition:all .18s;font-size:13px;font-weight:500;margin-bottom:1px;}
.nav-item:hover{background:var(--surface2);color:var(--accent);}
.nav-item.active{background:var(--accent-l);color:var(--accent);font-weight:700;}
.nav-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-icon{background:var(--accent-l2);}
.nav-badge{margin-left:auto;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-badge.red{background:var(--red);color:#fff;}
.nav-badge.orange{background:var(--orange);color:#fff;}
.nav-badge.blue{background:var(--accent);color:#fff;}
.sb-footer{padding:14px;border-top:1px solid var(--border);}
.gcal-btn{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text2);padding:9px 12px;border-radius:10px;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:600;width:100%;transition:all .2s;}
.gcal-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.gcal-btn.on{border-color:var(--green);color:var(--green);background:var(--green-bg);}

/* LAYOUT */
.content{display:flex;flex-direction:column;flex:1;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.04);}
.tb-date{font-size:12px;color:var(--text3);font-weight:500;}
.tb-right{display:flex;align-items:center;gap:8px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.tb-pill{display:flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:1.5px solid transparent;}
.tb-pill.red{background:var(--red-bg);color:var(--red);border-color:#FECACA;}
.tb-pill.red:hover{background:var(--red);color:#fff;}
.tb-pill.green{background:var(--green-bg);color:var(--green);border-color:#A7F3D0;cursor:default;}
.main{padding:28px 32px;overflow-y:auto;flex:1;}

/* PAGE HEADER */
.ph{margin-bottom:22px;}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;}
.pt{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.03em;}
.pt span{color:var(--accent);}
.ps{color:var(--text3);font-size:12px;font-weight:500;margin-top:3px;}

/* SEARCH BAR */

// ─── GCAL ──────────────────────────────────────────────────────────────────
const GCalSvc = {
  loaded:false,signed:false,
  async init(){return new Promise(res=>{if(window.gapi){res();return;}const s=document.createElement("script");s.src="https://apis.google.com/js/api.js";s.onload=()=>window.gapi.load("client:auth2",async()=>{try{await window.gapi.client.init({apiKey:GCAL.API_KEY,clientId:GCAL.CLIENT_ID,discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],scope:GCAL.SCOPES});GCalSvc.loaded=true;GCalSvc.signed=window.gapi.auth2.getAuthInstance().isSignedIn.get();}catch{}res();});document.head.appendChild(s);});},
  async signIn(){if(!GCalSvc.loaded)await GCalSvc.init();await window.gapi.auth2.getAuthInstance().signIn();GCalSvc.signed=true;},
  async create(appt,label){if(!GCalSvc.signed)return null;const s=new Date(`${appt.date}T${appt.time}:00`),e=new Date(s.getTime()+appt.duration*60000);const r=await window.gapi.client.calendar.events.insert({calendarId:GCAL.CALENDAR_ID,resource:{summary:appt.title,location:appt.location,description:appt.notes||label,start:{dateTime:s.toISOString(),timeZone:"Europe/Paris"},end:{dateTime:e.toISOString(),timeZone:"Europe/Paris"}}});return r.result.id;},
  async del(id){if(GCalSvc.signed&&id)await window.gapi.client.calendar.events.delete({calendarId:GCAL.CALENDAR_ID,eventId:id});}
};

// ─── CSV EXPORT ────────────────────────────────────────────────────────────
const exportCSV = (data, filename) => {
  if(!data.length)return;
  const keys=Object.keys(data[0]);
  const rows=[keys.join(";"),...data.map(r=>keys.map(k=>JSON.stringify(r[k]??"",[],0)).join(";"))];
  const blob=new Blob(["\uFEFF"+rows.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
};

// ══════════════════════════════════════════════════════════════════════════
function App(){
  const [page,setPage]=useState("dashboard");
  const [leads,setLeads]=useState([]);
  const [clients,setClients]=useState([]);
  const [appts,setAppts]=useState([]);
  const [gcal,setGcal]=useState(false);
  const [loaded,setLoaded]=useState(false);
  const [modal,setModal]=useState(null);
  const [selectedClient,setSelectedClient]=useState(null);
  const [selectedLead,setSelectedLead]=useState(null);
  const [qualifyForm,setQualifyForm]=useState({name:"",phone:"",email:"",notes:"",criteria:{type:"",budgetMax:"",sectors:"",surfaceMin:"",moveDate:"",specific:"",profile:"",revenues:"",guarantor:""}});
  const [prodView,setProdView]=useState("kanban");
  const [dragOver,setDragOver]=useState(null);
  const [search,setSearch]=useState("");
  const [toasts,setToasts]=useState([]);

  // Inject CSS
  useEffect(()=>{
    const el=document.createElement("style");
    el.setAttribute("data-soloc","1");
    el.textContent=CSS;
    document.head.appendChild(el);
    return()=>{document.head.removeChild(el);};
  },[]);
  const dragItem=useRef(null);
  const dragType=useRef(null);

  const blankLead={firstName:"",lastName:"",phone:"",email:"",source:"Site web",notes:""};
  const blankAppt={clientId:"",title:"",date:"",time:"09:00",duration:60,location:"",notes:""};
  const [leadForm,setLeadForm]=useState(blankLead);
  const [leadError,setLeadError]=useState("");
  const [apptForm,setApptForm]=useState(blankAppt);

  // ── TOAST ──
  const addToast = useCallback((text,type="success")=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,text,type}]);
    setTimeout(()=>setToasts(p=>p.map(t=>t.id===id?{...t,out:true}:t)),3200);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3600);
  },[]);

  // ── PERSIST — storage first, seeds only if empty ──
  useEffect(()=>{(async()=>{
    const l=await storage.get("s6_leads");
    const c=await storage.get("s6_clients");
    const a=await storage.get("s6_appts");
    setLeads(l&&l.length?l:SEED_LEADS);
    setClients(c&&c.length?c:SEED_CLIENTS);
    setAppts(a&&a.length?a:SEED_APPOINTMENTS);
    setLoaded(true);
  })();},[]);
  useEffect(()=>{if(loaded)storage.set("s6_leads",leads);},[leads,loaded]);
  useEffect(()=>{if(loaded)storage.set("s6_clients",clients);},[clients,loaded]);
  useEffect(()=>{if(loaded)storage.set("s6_appts",appts);},[appts,loaded]);

  // ── BACKUP ──
  const doBackup = useCallback((manual=false) => {
    const data = {
      version: "s6",
      exportedAt: new Date().toISOString(),
      leads, clients, appts
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().split("T")[0];
    a.href = url;
    a.download = "soloc-backup-"+date+".json";
    a.click();
    URL.revokeObjectURL(url);
    storage.set("s6_lastBackup", new Date().toISOString());
    if(manual) addToast("💾 Sauvegarde téléchargée","success");
  }, [leads, clients, appts]);

  useEffect(()=>{
    if(!loaded) return;
    (async()=>{
      const last = await storage.get("s6_lastBackup");
      const lastDate = last ? new Date(String(last).replace(/"/g,"")) : null;
      const daysSinceLast = lastDate ? (Date.now()-lastDate.getTime())/86400000 : 999;
      if(daysSinceLast >= 7){
        // Small delay so app is fully rendered first
        setTimeout(()=>doBackup(false), 2000);
      }
    })();
  },[loaded]);

  // ── ALERTS ──
  const la=getLeadAlerts(leads);
  const ca=getClientAlerts(clients);
  const totalAlerts=la.urgent.length+la.relance3Due.length+la.relance7Due.length+la.relance3Late.length+la.relance7Late.length+la.interestedDue.length+la.interestedLate.length+ca.length;
  const newLeads=leads.filter(l=>l.column==="new").length;
  const todayRelances=appts.filter(a=>a.isRelance&&a.date===todayStr());
  const todayClientAppts=appts.filter(a=>!a.isRelance&&a.date===todayStr());
  const todayCount=todayRelances.length+todayClientAppts.length;

  // ── STATS ──
  const activeSearching=clients.filter(c=>["searching","visit","dossier"].includes(c.column)).length;
  const loggedThisMonth=clients.filter(c=>["signed","paid"].includes(c.column)&&hoursSince(c.enteredAt)<=(31*24)).length;
  const pendingCA=clients.filter(c=>c.column==="signed").length*1200;
  const leadsThisWeek=leads.filter(l=>l.column!=="lost"&&hoursSince(l.enteredAt)<=168).length;

  // ── CONVERSION STATS ──
  const convStats = ALL_SOURCES.map(src=>{
    const total=leads.filter(l=>l.source===src).length;
    const converted=clients.filter(c=>c.notes?.includes(src)||leads.find(l=>l.id===c.fromLeadId)?.source===src).length;
    const qualified=leads.filter(l=>l.source===src&&l.column==="qualified").length;
    return {src,total,qualified,rate:total>0?Math.round((qualified/total)*100):0};
  }).filter(s=>s.total>0);

  // ── SEARCH FILTER ──
  const q=search.toLowerCase();
  const filteredLeads=leads.filter(l=>l.name.toLowerCase().includes(q)||l.phone.includes(q)||l.email.toLowerCase().includes(q));
  const filteredClients=clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)||c.email.toLowerCase().includes(q));

  // ── DRAG & DROP ──
  const onDragStart=(e,id,type)=>{dragItem.current=id;dragType.current=type;};
  const onDrop=async(e,col)=>{
    e.preventDefault();setDragOver(null);
    if(!dragItem.current)return;

    if(dragType.current==="lead"){
      const lead=leads.find(l=>l.id===dragItem.current);
      if(!lead){dragItem.current=null;return;}
      if(lead.column===col){dragItem.current=null;return;}

      let updatedLead={...lead,column:col};
      let newAppt=null;
      const today=fmtDDMMYYYY(nowISO());

      // Build history event based on destination
      let histEvent=null;
      if(col==="relance1"){
        histEvent=mkEvent("📞","Appelé le "+today+" — pas de réponse");
      } else if(col==="relance2"){
        const r1Event=lead.history?.find(h=>h.text.includes("Appelé le"));
        const r1Date=r1Event?r1Event.text.match(/\d{2}\/\d{2}\/\d{4}/)?.[0]||today:today;
        histEvent=mkEvent("🔁","Appel relance J+3 le "+r1Date+" — pas de réponse");
      } else if(col==="interested"){
        histEvent=mkEvent("🔥","Intérêt confirmé le "+today+" — dossier envoyé");
        // Schedule a follow-up in 7 working days
        const targetDate=addWorkingDays(new Date(),7);
        const time=findRelanceSlot(appts,targetDate);
        const apptId="ri"+Date.now();
        newAppt={id:apptId,clientId:null,leadId:lead.id,title:"🔥 Relance Chaud — "+lead.name,date:targetDate,time,duration:5,location:"Téléphone",notes:lead.phone,gcalId:null,isRelance:true};
        updatedLead={...updatedLead,relanceDate:targetDate,relanceApptId:apptId};
        if(gcal){try{const gid=await GCalSvc.create(newAppt,"Relance Chaud "+lead.name);newAppt={...newAppt,gcalId:gid};}catch{}}
        addToast("📅 Relance Chaud planifiée — "+fmtDate(targetDate).full+" à "+time,"orange");
      } else if(col==="qualified"){
        histEvent=mkEvent("✅","Qualifié le "+today);
      } else if(col==="lost"){
        histEvent=mkEvent("❌","Perdu le "+today);
      } else if(col==="new"){
        histEvent=mkEvent("↩️","Remis en nouveau lead le "+today);
      }
      if(histEvent) updatedLead={...updatedLead,history:[...(lead.history||[]),histEvent]};

      // Auto-schedule relance agenda
      if(col==="relance1"||col==="relance2"){
        const daysOff=col==="relance1"?3:7;
        const targetDate=addWorkingDays(new Date(),daysOff);
        if(lead.relanceApptId){
          const old=appts.find(a=>a.id===lead.relanceApptId);
          if(old?.gcalId)await GCalSvc.del(old.gcalId);
          setAppts(p=>p.filter(a=>a.id!==lead.relanceApptId));
        }
        const time=findRelanceSlot(appts,targetDate);
        const apptId="ra"+Date.now();
        const label=col==="relance1"?"Relance J+3":"Relance J+7";
        newAppt={id:apptId,clientId:null,leadId:lead.id,title:`📞 ${label} — ${lead.name}`,date:targetDate,time,duration:5,location:"Téléphone",notes:lead.phone,gcalId:null,isRelance:true};
        updatedLead={...updatedLead,relanceDate:targetDate,relanceApptId:apptId};
        if(gcal){try{const gid=await GCalSvc.create(newAppt,label+" "+lead.name);newAppt={...newAppt,gcalId:gid};}catch{}}
        addToast(`📅 ${label} créée — ${fmtDate(targetDate).full} à ${time}`,"orange");
      }

      // Clean relance if moving away
      if(!["relance1","relance2"].includes(col)&&lead.relanceApptId){
        const old=appts.find(a=>a.id===lead.relanceApptId);
        if(old?.gcalId)await GCalSvc.del(old.gcalId);
        setAppts(p=>p.filter(a=>a.id!==lead.relanceApptId));
        updatedLead={...updatedLead,relanceDate:null,relanceApptId:null};
      }

      setLeads(p=>p.map(l=>l.id===dragItem.current?updatedLead:l));
      if(newAppt)setAppts(p=>[...p,newAppt]);
    } else {
      setClients(p=>p.map(c=>c.id===dragItem.current?{...c,column:col,lastActivity:nowISO()}:c));
      addToast(`✓ Client déplacé — ${PROD_COLS.find(c=>c.id===col)?.label}`,"success");
    }
    dragItem.current=null;
  };

  // ── CONVERT ──
  const blankCriteria = {type:"",budgetMax:"",sectors:"",surfaceMin:"",moveDate:"",specific:"",profile:"",revenues:"",guarantor:""};

  const convertLead=(lead)=>{
    setSelectedLead(lead);
    setQualifyForm({
      name: lead.name||"",
      phone: lead.phone||"",
      email: lead.email||"",
      notes: lead.notes||"",
      criteria: {...blankCriteria},
    });
    setModal("qualify");
  };

  const saveQualify=()=>{
    if(selectedLead?.relanceApptId) setAppts(p=>p.filter(a=>a.id!==selectedLead.relanceApptId));
    const nc={
      id:"c"+Date.now(),
      name:qualifyForm.name, phone:qualifyForm.phone, email:qualifyForm.email,
      enteredAt:nowISO(), column:"searching",
      criteria:qualifyForm.criteria,
      notes:qualifyForm.notes, lastActivity:nowISO()
    };
    setLeads(p=>p.map(l=>l.id===selectedLead.id?{...l,column:"qualified",history:[...(l.history||[]),mkEvent("🏠","Converti en client le "+fmtDDMMYYYY(nowISO()))]}:l));
    setClients(p=>[...p,nc]);
    setModal(null);
    addToast("🏠 "+nc.name+" converti en client !","success");
  };

  const connectGcal=async()=>{try{await GCalSvc.signIn();setGcal(true);addToast("Google Calendar connecté ✓","success");}catch{addToast("Connexion GCal échouée","info");}};
  const pushGcal=async(appt)=>{if(!gcal){addToast("Connectez Google Calendar d'abord","info");return;}const cl=clients.find(c=>c.id===appt.clientId);try{const id=await GCalSvc.create(appt,cl?.name||"");setAppts(p=>p.map(a=>a.id===appt.id?{...a,gcalId:id}:a));addToast("✓ Synced dans Google Calendar","success");}catch{addToast("Erreur GCal","info");}};

  const saveLead=()=>{
    const hasIdentity = leadForm.firstName.trim() || leadForm.lastName.trim();
    const hasContact  = leadForm.phone.trim() || leadForm.email.trim();
    if(!hasIdentity || !hasContact){
      setLeadError(!hasIdentity
        ? "Renseignez au moins un prénom ou un nom."
        : "Renseignez au moins un téléphone ou un email."
      );
      return;
    }
    const fullName = [leadForm.firstName.trim(), leadForm.lastName.trim()].filter(Boolean).join(" ");
    const nl={id:"l"+Date.now(),...leadForm,name:fullName,enteredAt:nowISO(),column:"new",relanceDate:null,relanceApptId:null,history:[mkEvent("🌱","Lead créé — source : "+leadForm.source)]};
    setLeads(p=>[...p,nl]);setModal(null);setLeadForm(blankLead);setLeadError("");
    addToast("✓ Lead "+fullName+" ajouté","success");
  };
  const saveAppt=()=>{setAppts(p=>[...p,{id:"a"+Date.now(),...apptForm,duration:parseInt(apptForm.duration),gcalId:null,isRelance:false}]);setModal(null);setApptForm(blankAppt);addToast("✓ RDV créé","success");};
  const saveFiche=()=>{setClients(p=>p.map(c=>c.id===selectedClient.id?{...selectedClient,lastActivity:nowISO()}:c));setModal(null);addToast(`✓ Fiche ${selectedClient.name} enregistrée`,"success");};
  const deleteClient=(id)=>{if(confirm("Supprimer ?"))setClients(p=>p.filter(c=>c.id!==id));};
  const deleteLead=async(lead)=>{if(!confirm("Supprimer ?"))return;if(lead.relanceApptId){const a=appts.find(x=>x.id===lead.relanceApptId);if(a?.gcalId)await GCalSvc.del(a.gcalId);setAppts(p=>p.filter(x=>x.id!==lead.relanceApptId));}setLeads(p=>p.filter(l=>l.id!==lead.id));};
  const deleteAppt=async(a)=>{if(!confirm("Supprimer ?"))return;if(a.gcalId)await GCalSvc.del(a.gcalId);if(a.leadId)setLeads(p=>p.map(l=>l.id===a.leadId?{...l,relanceApptId:null,relanceDate:null}:l));setAppts(p=>p.filter(x=>x.id!==a.id));};

  const leadUrgency=(l)=>{const h=hoursSince(l.enteredAt);if(["lost","qualified","interested"].includes(l.column))return null;if(h>=48)return"red";if(h>=24)return"orange";return null;};

  // ── ADD NEW CLIENT ──
  const addNewClient = () => {
    const nc = {
      id: "c"+Date.now(), name:"Nouveau client", phone:"", email:"",
      enteredAt: nowISO(), column:"searching",
      criteria:{type:"",budgetMax:"",sectors:"",surfaceMin:"",moveDate:"",specific:"",profile:"",revenues:"",guarantor:""},
      notes:"", lastActivity:nowISO()
    };
    setClients(p=>[...p,nc]);
    setSelectedClient(nc);
    setModal("fiche");
  };

  // ── EXPORT HELPERS ──
  const exportLeads=()=>exportCSV(leads.map(l=>({Nom:l.name,Téléphone:l.phone,Email:l.email,Source:l.source,Statut:LEAD_COLS.find(c=>c.id===l.column)?.label||l.column,Notes:l.notes})),"soloc_leads.csv");
  const exportClients=()=>exportCSV(clients.map(c=>({Nom:c.name,Téléphone:c.phone,Email:c.email,Statut:PROD_COLS.find(x=>x.id===c.column)?.label||c.column,Type:c.criteria.type,Budget:c.criteria.budgetMax,Secteurs:c.criteria.sectors,Profil:c.criteria.profile,Revenus:c.criteria.revenues,Notes:c.notes})),"soloc_clients.csv");

  // ──────────────────────────────────────────────────────────────────────────
  return(
    <>
      <div className="app">

        {/* SIDEBAR */}
        <aside className="sb">
          <div className="sb-brand">
            <div className="sb-logo">S</div>
            <div><div className="sb-name">soloc&apos;</div><div className="sb-sub">ESPACE PRO</div></div>
          </div>
          <div className="sb-nav">
            <div className="sb-lbl">Navigation</div>
            {[
              {id:"dashboard",icon:"dashboard",label:"Vue d'ensemble",badge:totalAlerts||null,bc:"red"},

              {id:"production",icon:"home",label:"Production",badge:ca.length||null,bc:"orange"},
              {id:"agenda",icon:"calendar",label:"Agenda",badge:todayCount||null,bc:"blue"},

              </div>
            ))}

          <div className="sb-footer">

              <Ic n="google" s={14}/>{gcal?"Google connecté ✓":"Connecter Google Cal"}

            {gcal&&<p style={{fontSize:10,color:"var(--text3)",textAlign:"center",marginTop:5,fontWeight:500}}>Sync Apple Calendar 🍎 actif</p>}
            <button onClick={()=>doBackup(true)} style={{marginTop:10,width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"8px",borderRadius:8,border:"1.5px solid var(--border2)",background:"var(--surface)",color:"var(--text3)",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              💾 Sauvegarder maintenant

          </div>

              {/* GLOBAL SEARCH */}
              <div className="search-bar">
                <Ic n="search" s={13}/>
                <input placeholder="Rechercher nom, tél, email…" value={search} onChange={e=>setSearch(e.target.value)}/>
                {search&&<button className="ib" style={{padding:2}} onClick={()=>setSearch("")}><Ic n="x" s={12}/></button>}
              </div>
              {todayCount>0&&<span style={{background:"var(--accent-l)",color:"var(--accent-d)",borderRadius:20,padding:"4px 10px",fontSize:12,fontWeight:600,border:"1px solid var(--accent-l2)",display:"flex",alignItems:"center",gap:5}}><Ic n="todo" s={11}/>{todayCount} action{todayCount>1?"s":""} aujourd&apos;hui</span>}
              {totalAlerts>0
                ?<div className="tb-pill red" onClick={()=>setPage("dashboard")}><Ic n="bell" s={13}/>{totalAlerts} alerte{totalAlerts>1?"s":""}</div>
                :<div className="tb-pill green"><Ic n="check" s={12}/>Tout est à jour</div>
              }
              <div className="avatar">SL</div>
            </div>
          </div>

          <div className="main">

            {/* ════ DASHBOARD ════ */}
            {page==="dashboard"&&(
              <div className="fade-in">
                <div className="ph">
                  <div className="pt">Bonjour, <span>bonne journée</span> 👋</div>
                  <div className="ps">Tableau de bord — activité chasseur locatif SOLOC&apos;</div>
                </div>
                <div className="kpi-grid">
                  <div className="kpi hl"><div className="kpi-ic"><Ic n="home" s={16}/></div><div className="kpi-lbl">En recherche active</div><div className="kpi-val">{activeSearching}</div><div className="kpi-sub">clients suivis</div></div>
                  <div className="kpi"><div className="kpi-ic" style={{background:"var(--green-bg)",color:"var(--green)"}}><Ic n="check" s={16}/></div><div className="kpi-lbl">Logés ce mois</div><div className="kpi-val">{loggedThisMonth}</div><div className="kpi-sub" style={{color:"var(--green)",fontWeight:600}}>↑ ce mois-ci</div></div>
                  <div className="kpi"><div className="kpi-ic" style={{background:"var(--orange-bg)",color:"var(--orange)"}}><Ic n="euro" s={16}/></div><div className="kpi-lbl">CA en attente</div><div className="kpi-val">{pendingCA.toLocaleString("fr-FR")} €</div><div className="kpi-sub">bail signé</div></div>
                  <div className="kpi"><div className="kpi-ic" style={{background:"var(--purple-bg)",color:"var(--purple)"}}><Ic n="target" s={16}/></div><div className="kpi-lbl">Leads cette semaine</div><div className="kpi-val">{leadsThisWeek}</div><div className="kpi-sub">{newLeads} non traité{newLeads>1?"s":""}</div></div>
                </div>

                {/* TO DO DU JOUR */}
                {(todayRelances.length>0||todayClientAppts.length>0)&&(
                  <div className="sc" style={{marginBottom:16,borderLeft:"4px solid var(--accent)"}}>
                    <div className="sc-hd">
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <div className="sc-title">📋 To Do — Aujourd&apos;hui</div>
                        <span style={{background:"var(--accent)",color:"#fff",borderRadius:20,padding:"1px 8px",fontSize:11,fontWeight:700}}>{todayRelances.length+todayClientAppts.length}</span>
                      </div>
                    </div>
                    {todayRelances.map(a=>{
                      const lead=leads.find(l=>l.id===a.leadId);
                      return(<div key={a.id} className="todo-item relance" onClick={()=>setPage("prospection")}><div className="todo-dot" style={{background:"var(--orange)"}}/><div style={{flex:1}}><div className="todo-name">{a.title}</div><div className="todo-meta"><Ic n="phone" s={10}/> {lead?.phone||a.notes}</div></div><span className="todo-time orange">{a.time}</span></div>);
                    })}
                    {todayClientAppts.map(a=>{
                      const cl=clients.find(c=>c.id===a.clientId);
                      return(<div key={a.id} className="todo-item visit" onClick={()=>setPage("agenda")}><div className="todo-dot" style={{background:"var(--accent)"}}/><div style={{flex:1}}><div className="todo-name">{a.title}</div><div className="todo-meta">{cl?.name} · {a.location}</div></div><span className="todo-time blue">{a.time}</span></div>);
                    })}
                  </div>
                )}

                <div className="dash-grid">
                  <div className="sc">
                    <div className="sc-hd"><div className="sc-title">⚡ Alertes &amp; Actions</div>{totalAlerts===0&&!newLeads&&<span style={{fontSize:11,fontWeight:600,color:"var(--green)"}}>✓ Tout à jour</span>}</div>
                    {la.urgent.length>0&&(<div className="alert-block red"><div className="alert-hd red"><span className="pulse">🔴</span>{la.urgent.length} lead{la.urgent.length>1?"s":""} sans action +24h</div><div className="alert-rows">{la.urgent.map(l=>(<div key={l.id} className="alert-row"><div><div className="alert-name">{l.name}</div><div className="alert-meta"><a className="tel-link" href={"tel:"+(l.phone||"").replace(/\s/g,"")}><Ic n="phone" s={10}/>{l.phone}</a></div></div><div style={{display:"flex",gap:7,alignItems:"center"}}><span className="alert-pill red">+{Math.floor(hoursSince(l.enteredAt))}h</span><button className="btn btn-sm" style={{background:"var(--red)",color:"#fff",fontSize:11}} onClick={()=>setPage("prospection")}>Traiter</button></div></div>))}</div></div>)}
                    {la.relance3Due.length>0&&(<div className="alert-block orange"><div className="alert-hd orange">📞 {la.relance3Due.length} relance J+3 aujourd&apos;hui</div><div className="alert-rows">{la.relance3Due.map(l=>{const a=appts.find(x=>x.id===l.relanceApptId);return(<div key={l.id} className="alert-row"><div><div className="alert-name">{l.name}</div><div className="alert-meta"><a className="tel-link" href={"tel:"+(l.phone||"").replace(/\s/g,"")}><Ic n="phone" s={10}/>{l.phone}</a> · {a?"à "+a.time:""}</div></div><button className="btn btn-sm btn-g" onClick={()=>setPage("agenda")}>Agenda</button></div>);})}</div></div>)}
                    {la.relance7Due.length>0&&(<div className="alert-block orange"><div className="alert-hd orange">📞 {la.relance7Due.length} relance J+7 aujourd&apos;hui</div><div className="alert-rows">{la.relance7Due.map(l=>{const a=appts.find(x=>x.id===l.relanceApptId);return(<div key={l.id} className="alert-row"><div><div className="alert-name">{l.name}</div><div className="alert-meta"><a className="tel-link" href={"tel:"+(l.phone||"").replace(/\s/g,"")}><Ic n="phone" s={10}/>{l.phone}</a> · {a?"à "+a.time:""}</div></div><button className="btn btn-sm btn-g" onClick={()=>setPage("agenda")}>Agenda</button></div>);})}</div></div>)}
                    {(la.relance3Late.length>0||la.relance7Late.length>0)&&(<div className="alert-block red"><div className="alert-hd red"><Ic n="clock" s={13}/>{la.relance3Late.length+la.relance7Late.length} relance{la.relance3Late.length+la.relance7Late.length>1?"s":""} en retard</div><div className="alert-rows">{[...la.relance3Late,...la.relance7Late].map(l=>(<div key={l.id} className="alert-row"><div><div className="alert-name">{l.name}</div><div className="alert-meta">{l.column==="relance1"?"J+3":"J+7"} · prévu le {fmtDate(l.relanceDate).full}</div></div><span className="alert-pill red">En retard</span></div>))}</div></div>)}
                    {la.interestedDue.length>0&&(
                      <div className="alert-block orange">
                        <div className="alert-hd orange">🔥 {la.interestedDue.length} relance Chaud aujourd&apos;hui</div>
                        <div className="alert-rows">

                              <div key={l.id} className="alert-row">
                                <div>
                                  <div className="alert-name">{l.name}</div>
                                  <div className="alert-meta"><a className="tel-link" href={"tel:"+(l.phone||"").replace(/\s/g,"")}><Ic n="phone" s={10}/>{l.phone}</a>{a?" · à "+a.time:""}</div>
                                </div>
                                <button className="btn btn-sm btn-g" onClick={()=>setPage("agenda")}>Agenda</button>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                    {la.interestedLate.length>0&&(
                      <div className="alert-block red">
                        <div className="alert-hd red"><Ic n="clock" s={13}/>{la.interestedLate.length} relance Chaud en retard</div>
                        <div className="alert-rows">
                          {la.interestedLate.map(l=>(
                            <div key={l.id} className="alert-row">
                              <div>
                                <div className="alert-name">{l.name}</div>
                                <div className="alert-meta">🔥 Chaud · prévu le {fmtDate(l.relanceDate).full}</div>
                              </div>
                              <div style={{display:"flex",gap:7,alignItems:"center"}}>
                                <span className="alert-pill red">En retard</span>
                                <button className="btn btn-sm" style={{background:"var(--red)",color:"#fff",fontSize:11}} onClick={()=>setPage("prospection")}>Voir</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {ca.length>0&&(<div className="alert-block orange"><div className="alert-hd orange"><Ic n="alert" s={13}/>{ca.length} client{ca.length>1?"s":""} inactif{ca.length>1?"s":""} +7j</div><div className="alert-rows">{ca.map(inactCl=>(<div key={inactCl.id} className="alert-row"><div><div className="alert-name">{inactCl.name}</div><div className="alert-meta">{PROD_COLS.find(x=>x.id===inactCl.column)?.label}</div></div><div style={{display:"flex",gap:7,alignItems:"center"}}><span className="alert-pill orange">{Math.floor(daysSince(inactCl.lastActivity))}j</span><button className="btn btn-sm btn-g" onClick={()=>{setSelectedClient({...inactCl});setModal("fiche");}}>Fiche</button></div></div>))}</div></div>)}
                    {totalAlerts===0&&newLeads===0&&(<div style={{textAlign:"center",padding:"22px 0"}}><div style={{fontSize:28,marginBottom:5}}>✅</div><div style={{fontWeight:700,color:"var(--green)",fontSize:14}}>Tout est à jour !</div></div>)}
                  </div>
                  <div className="sc">
                    <div className="sc-hd"><div className="sc-title">Pipeline production</div></div>
                    {PROD_COLS.map(col=>{const count=clients.filter(c=>c.column===col.id).length;return(<div key={col.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}><div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:500,color:"var(--text2)"}}><span className="col-dot" style={{background:col.color}}/>{col.label}</div><span style={{fontWeight:800,color:count>0?"var(--text)":"var(--text3)",fontSize:14}}>{count}</span></div>);})}
                    <button className="btn btn-p btn-sm" style={{marginTop:12,width:"100%"}} onClick={()=>setPage("production")}>Voir la production →</button>
                  </div>

              </div>
            )}

            {/* ════ PROSPECTION ════ */}
            {page==="prospection"&&(
              <div className="fade-in">

                    <div className="pt">Prospection <span>&amp; Leads</span></div>
                    <div className="ps">{filteredLeads.filter(l=>l.column!=="lost").length} leads actifs{search?" pour "+search:""}</div>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button className="btn-export" onClick={exportLeads}><Ic n="download" s={13}/>Export CSV</button>

function ManualNoteForm({lead, onSave}){

    <div style={{display:"flex",gap:8}}>

      <button className="btn btn-p btn-sm" disabled={!val.trim()} onClick={()=>{if(val.trim()){onSave(val.trim());setVal("");}}}><Ic n="check" s={12}/>OK</button>

// ── API PARTENAIRES ──────────────────────────────────────────────────────
const PARTNERS_API = 'https://script.google.com/macros/s/AKfycbyPQFA-DM8doJkjDp3oc8J9s-BFn2X6QQtaeshYkC1z5HwGkIVsflFl8vPh5kHXTchwlw/exec';
async function pGet(){try{const r=await fetch(PARTNERS_API);const data=await r.json();return Array.isArray(data)?data.map(p=>({id:p.id||'',agence:p.agence||'',nom:p.nom||'',prenom:p.prenom||'',email:p.email||'',telephone:p.telephone||''})):[];}catch{return [];}}
async function pPost(data){await fetch(PARTNERS_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}

// ── PARTNER MODAL ────────────────────────────────────────────────────────
function PartnerModal({data,onSave,onClose,saving}){
  const [f,setF]=useState(data||{id:'',agence:'',nom:'',prenom:'',email:'',telephone:''});
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=()=>{if(!f.agence.trim()&&!f.nom.trim())return;onSave(f);};
  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&!saving&&onClose()}>
      <div className="modal fade-in" style={{maxWidth:480}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <div className="modal-title" style={{marginBottom:0}}>{data?'Modifier':'Nouveau contact'}</div>
          <button className="ib" onClick={onClose}><Ic n="x" s={18}/></button>
        </div>
        <div className="fg"><label className="fl">Agence *</label><input className="fi" placeholder="Foncia Lyon 7" value={f.agence} onChange={e=>upd('agence',e.target.value)} autoFocus disabled={saving}/></div>
        <div className="fr">
          <div className="fg"><label className="fl">Nom</label><input className="fi" placeholder="Martin" value={f.nom} onChange={e=>upd('nom',e.target.value)} disabled={saving}/></div>
          <div className="fg"><label className="fl">Prénom</label><input className="fi" placeholder="Sophie" value={f.prenom} onChange={e=>upd('prenom',e.target.value)} disabled={saving}/></div>
        </div>
        <div className="fg"><label className="fl">Email</label><input className="fi" type="email" placeholder="sophie@foncia.com" value={f.email} onChange={e=>upd('email',e.target.value)} disabled={saving}/></div>
        <div className="fg"><label className="fl">Téléphone</label><input className="fi" placeholder="06 12 34 56 78" value={f.telephone} onChange={e=>upd('telephone',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} disabled={saving}/></div>
        <div className="fa">
          <button className="btn btn-g" onClick={onClose} disabled={saving}>Annuler</button>
          <button className="btn btn-p" onClick={submit} disabled={saving}><Ic n="check" s={13}/>{saving?'Envoi…':'Enregistrer'}</button>
        </div>
      </div>
    </div>
  );
}

// ── PARTENAIRES PAGE ─────────────────────────────────────────────────────
function PartenairesPage(){
  const [partners,setPartners]=useState([]);
  const [search,setSearch]=useState('');
  const [pModal,setPModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [newIds,setNewIds]=useState(new Set());
  const [pToast,setPToast]=useState('');
  const prevIds=useRef(new Set());
  const pollRef=useRef(null);
  const toastRef=useRef(null);

  const toast=(msg)=>{setPToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setPToast(''),2800);};

  const load=async(silent)=>{
    if(!silent)setLoading(true);else setSyncing(true);
    try{
      const data=await pGet();
      const arr=Array.isArray(data)?data:[];
      const ids=new Set(arr.map(p=>String(p.id)));
      const added=[...ids].filter(id=>prevIds.current.size>0&&!prevIds.current.has(id));
      if(added.length>0){setNewIds(new Set(added));toast(added.length+' nouveau contact ajouté par le stagiaire');setTimeout(()=>setNewIds(new Set()),5000);}
      prevIds.current=ids;
      setPartners(arr);
    }catch(e){if(!silent)toast('Erreur de connexion');}
    finally{setLoading(false);setSyncing(false);}
  };

  useEffect(()=>{load(false);pollRef.current=setInterval(()=>load(true),8000);return()=>clearInterval(pollRef.current);},[]);

  const save=async(f)=>{
    setSaving(true);
    const isNew=!f.id;
    const p={...f,id:f.id||Date.now().toString(),action:isNew?'add':'update'};
    try{
      await pPost(p);
      setPartners(prev=>isNew?[...prev,p]:prev.map(x=>x.id===p.id?p:x));
      prevIds.current.add(String(p.id));
      setPModal(null);
      toast(isNew?'Contact ajouté':'Contact modifié');
      setTimeout(()=>load(true),2000);
    }catch{toast('Erreur envoi');}
    finally{setSaving(false);}
  };

  const del=async(id)=>{
    if(!window.confirm('Supprimer ?'))return;
    try{await pPost({action:'delete',id});setPartners(prev=>prev.filter(x=>x.id!==id));prevIds.current.delete(String(id));toast('Supprimé');}
    catch{toast('Erreur');}
  };

  const csv=()=>{
    const h=['Agence','Nom','Prénom','Email','Téléphone'];
    const rows=partners.map(p=>[p.agence,p.nom,p.prenom,p.email,p.telephone]);
    const c=[h,...rows].map(r=>r.map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(';')).join('\n');
    const b=new Blob(['\uFEFF'+c],{type:'text/csv;charset=utf-8;'});
    const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download='partenaires-soloc-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(u);
  };

  const q=search.toLowerCase();
  const filtered=partners.filter(p=>!q||[p.agence,p.nom,p.prenom,p.email,p.telephone].some(v=>(v||'').toLowerCase().includes(q)));

  return(
    <div className="fade-in">
      <div className="ph">
        <div className="pt">Partenaires <span>& Réseau</span></div>
        <div className="ps">
          Gestionnaires & commerciaux location à démarcher — {partners.length} contact{partners.length!==1?'s':''}
          {syncing&&<span style={{fontSize:11,opacity:0.5}}> · sync…</span>}
        </div>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <input
          style={{flex:1,minWidth:200,padding:'9px 13px',border:'1px solid var(--border)',borderRadius:8,fontFamily:'inherit',fontSize:13,background:'var(--surface)',color:'var(--text1)',outline:'none'}}
          placeholder="🔍  Rechercher agence, nom, email…"
          value={search} onChange={e=>setSearch(e.target.value)}
        />
        <button className="btn btn-g" onClick={csv}>⬇ Export CSV</button>
        <button className="btn btn-p" onClick={()=>setPModal('new')}><Ic n="plus" s={13}/>Ajouter</button>
      </div>
      <div className="sc" style={{padding:0,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1.3fr 1.3fr 2fr 1.4fr 70px',padding:'9px 14px',background:'var(--bg2)',fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.5px',color:'var(--text3)',borderBottom:'1px solid var(--border)'}}>
          <div>Agence</div><div>Nom</div><div>Prénom</div><div>Email</div><div>Téléphone</div><div></div>
        </div>
        {loading&&<div style={{textAlign:'center',padding:'40px',color:'var(--text3)',fontSize:13}}>Chargement…</div>}
        {!loading&&filtered.length===0&&(
          <div style={{textAlign:'center',padding:'48px 20px',color:'var(--text3)'}}>
            <div style={{fontSize:32,marginBottom:8}}>{partners.length===0?'📋':'🔍'}</div>
            <div style={{fontWeight:700,color:'var(--text1)',marginBottom:4}}>{partners.length===0?'Aucun contact encore':'Aucun résultat'}</div>
            <div style={{fontSize:12}}>{partners.length===0?'Clique sur Ajouter pour commencer.':'Essaie un autre mot-clé.'}</div>
          </div>
        )}
        {!loading&&filtered.map(p=>(
          <div key={p.id}
            style={{display:'grid',gridTemplateColumns:'2fr 1.3fr 1.3fr 2fr 1.4fr 70px',padding:'11px 14px',borderBottom:'1px solid var(--border)',alignItems:'center',fontSize:13,transition:'background 0.1s'}}
            onMouseEnter={e=>e.currentTarget.style.background='var(--bg2)'}
            onMouseLeave={e=>e.currentTarget.style.background=''}>
            <div style={{fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>
              {p.agence||'—'}
              {newIds.has(String(p.id))&&<span style={{marginLeft:5,background:'#E2F7EF',color:'#1A7A55',fontSize:10,fontWeight:800,padding:'1px 5px',borderRadius:8}}>NEW</span>}
            </div>
            <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>{p.nom||'—'}</div>
            <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>{p.prenom||'—'}</div>
            <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>
              {p.email?<a href={"mailto:"+p.email} style={{color:'var(--blue)',textDecoration:'none'}}>{p.email}</a>:<span style={{color:'var(--text3)'}}>—</span>}
            </div>
            <div style={{color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>{p.telephone||'—'}</div>
            <div style={{display:'flex',gap:5,justifyContent:'flex-end'}}>
              <button className="ib" onClick={()=>setPModal(p)}><Ic n="edit" s={13}/></button>
              <button className="ib" style={{color:'var(--red)'}} onClick={()=>del(p.id)}><Ic n="trash" s={13}/></button>
            </div>
          </div>
        ))}
      </div>
      {pModal&&<PartnerModal data={pModal==='new'?null:pModal} onSave={save} onClose={()=>setPModal(null)} saving={saving}/>}
      {pToast&&<div style={{position:'fixed',bottom:24,right:24,background:'#1a2a3a',color:'#fff',padding:'10px 18px',borderRadius:8,fontSize:13,fontWeight:600,zIndex:999,boxShadow:'0 8px 24px rgba(0,0,0,0.25)'}}>{pToast}</div>}
    </div>
  );
}



    const domNode = document.getElementById('root');
    const root = ReactDOM.createRoot(domNode);
    root.render(React.createElement(App));
  </script>
</body>
</html>
