// ─── STORAGE ───────────────────────────────────────────────────────────────
const storage = {
  async get(k) {
    try {
      const r = localStorage.getItem(k);
      return r ? JSON.parse(r) : null;
    } catch {
      return null;
    }
  },
  async set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};

// ─── DATE HELPERS ──────────────────────────────────────────────────────────
const nowISO = () => new Date().toISOString();
const hoursAgo = h => new Date(Date.now() - h * 3600000).toISOString();
const todayStr = () => new Date().toISOString().split("T")[0];
const fmtDDMMYYYY = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
};
const addWorkingDays = (fromDate, days) => {
  const d = new Date(fromDate);
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) added++;
  }
  return d.toISOString().split("T")[0];
};
const findRelanceSlot = (appts, targetDate) => {
  const BASE_H = 9,
    BASE_M = 30;
  const existing = appts.filter(a => a.date === targetDate && a.isRelance).map(a => a.time);
  let h = BASE_H,
    m = BASE_M;
  for (let i = 0; i < 24; i++) {
    const t = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    if (!existing.includes(t)) return t;
    m += 5;
    if (m >= 60) {
      h++;
      m -= 60;
    }
  }
  return "09:30";
};
const MONTHS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jun", "Jul", "Aoû", "Sep", "Oct", "Nov", "Déc"];
const fmtDate = d => {
  if (!d) return {
    day: "—",
    month: "",
    full: ""
  };
  const [y, mo, day] = d.split("-");
  return {
    day: parseInt(day),
    month: MONTHS[parseInt(mo) - 1],
    full: `${parseInt(day)} ${MONTHS[parseInt(mo) - 1]} ${y}`
  };
};
const hoursSince = iso => iso ? (Date.now() - new Date(iso).getTime()) / 3600000 : 0;
const daysSince = iso => iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : 0;
const isToday = dateStr => dateStr === todayStr();

// ─── HISTORY HELPERS ───────────────────────────────────────────────────────

// ─── CSS ───────────────────────────────────────────────────────────────────
const CSS = `@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#EEF3F8;--surface:#fff;--surface2:#F5F8FC;
  --border:#DDE5EF;--border2:#C8D6E8;
  --text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --accent:#2BAAE0;--accent-d:#1A8FBF;--accent-l:#E0F4FC;--accent-l2:#C5EBFA;
  --green:#10B981;--green-bg:#D1FAE5;
  --red:#EF4444;--red-bg:#FEE2E2;--red-l:#FFF5F5;
  --orange:#F59E0B;--orange-bg:#FEF3C7;--orange-l:#FFFBEB;
  --purple:#8B5CF6;--purple-bg:#EDE9FE;
  --sh:0 2px 12px rgba(43,170,224,.08);--sh-md:0 4px 24px rgba(43,170,224,.13);--sh-lg:0 8px 40px rgba(0,0,0,.12);
}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif;font-size:14px;line-height:1.5;}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sb{width:232px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;box-shadow:2px 0 16px rgba(0,0,0,.04);}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-logo{width:38px;height:38px;background:var(--accent);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(43,170,224,.35);}
.sb-name{font-weight:800;font-size:17px;color:var(--text);letter-spacing:-.02em;}
.sb-sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.05em;}
.sb-nav{padding:12px 10px 8px;flex:1;overflow-y:auto;}
.sb-lbl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin-bottom:4px;margin-top:10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text2);cursor:pointer;transition:all .18s;font-size:13px;font-weight:500;margin-bottom:1px;}
.nav-item:hover{background:var(--surface2);color:var(--accent);}
.nav-item.active{background:var(--accent-l);color:var(--accent);font-weight:700;}
.nav-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-icon{background:var(--accent-l2);}
.nav-badge{margin-left:auto;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-badge.red{background:var(--red);color:#fff;}
.nav-badge.orange{background:var(--orange);color:#fff;}
.nav-badge.blue{background:var(--accent);color:#fff;}
.sb-footer{padding:14px;border-top:1px solid var(--border);}
.gcal-btn{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text2);padding:9px 12px;border-radius:10px;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:600;width:100%;transition:all .2s;}
.gcal-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.gcal-btn.on{border-color:var(--green);color:var(--green);background:var(--green-bg);}

/* LAYOUT */
.content{display:flex;flex-direction:column;flex:1;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.04);}
.tb-date{font-size:12px;color:var(--text3);font-weight:500;}
.tb-right{display:flex;align-items:center;gap:8px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.tb-pill{display:flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:1.5px solid transparent;}
.tb-pill.red{background:var(--red-bg);color:var(--red);border-color:#FECACA;}
.tb-pill.red:hover{background:var(--red);color:#fff;}
.tb-pill.green{background:var(--green-bg);color:var(--green);border-color:#A7F3D0;cursor:default;}
.main{padding:28px 32px;overflow-y:auto;flex:1;}

/* PAGE HEADER */
.ph{margin-bottom:22px;}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;}
.pt{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.03em;}
.pt span{color:var(--accent);}
.ps{color:var(--text3);font-size:12px;font-weight:500;margin-top:3px;}

/* SEARCH BAR */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border2);border-radius:10px;padding:8px 14px;width:260px;transition:all .18s;}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l);}
.search-bar input{border:none;background:transparent;outline:none;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;color:var(--text);width:100%;}
.search-bar input::placeholder{color:var(--text3);}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border-radius:14px;padding:16px 18px;border:1px solid var(--border);box-shadow:var(--sh);transition:all .2s;}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
.kpi.hl{background:var(--accent);border-color:var(--accent);}
.kpi-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-l);color:var(--accent);margin-bottom:10px;}
.kpi.hl .kpi-ic{background:rgba(255,255,255,.2);color:#fff;}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.kpi.hl .kpi-lbl{color:rgba(255,255,255,.7);}
.kpi-val{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.04em;}
.kpi.hl .kpi-val{color:#fff;}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.kpi.hl .kpi-sub{color:rgba(255,255,255,.8);}

/* DASH GRID */
.dash-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:16px;}

/* SECTION CARD */
.sc{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:var(--sh);padding:18px 20px;}
.sc-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}

/* TODO */
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:7px;border:1.5px solid transparent;transition:all .18s;cursor:pointer;}
.todo-item:hover{transform:translateX(2px);}
.todo-item.relance{background:var(--orange-l);border-color:#FDE68A;}
.todo-item.visit{background:var(--accent-l);border-color:var(--accent-l2);}
.todo-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.todo-name{font-weight:700;font-size:13px;color:var(--text);}
.todo-meta{font-size:11px;color:var(--text3);font-weight:500;}
.todo-time{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.todo-time.orange{background:var(--orange-bg);color:#92400e;}
.todo-time.blue{background:var(--accent-l2);color:var(--accent-d);}

/* ALERT BLOCKS */
.alert-block{border-radius:12px;overflow:hidden;margin-bottom:9px;border:1.5px solid transparent;}
.alert-block.red{background:var(--red-l);border-color:#FECACA;}
.alert-block.orange{background:var(--orange-l);border-color:#FDE68A;}
.alert-block.blue{background:var(--accent-l);border-color:var(--accent-l2);}
.alert-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12px;font-weight:700;}
.alert-hd.red{color:var(--red);}
.alert-hd.orange{color:#92400e;}
.alert-hd.blue{color:var(--accent-d);}
.alert-rows{border-top:1px solid rgba(0,0,0,.06);}
.alert-row{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04);}
.alert-row:last-child{border-bottom:none;}
.alert-name{font-weight:700;color:var(--text);}
.alert-meta{color:var(--text3);font-size:11px;}
.alert-pill{font-weight:700;font-size:11px;padding:2px 8px;border-radius:20px;}
.alert-pill.red{background:var(--red-bg);color:var(--red);}
.alert-pill.orange{background:var(--orange-bg);color:#92400e;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-bar-wrap{margin-bottom:8px;}
.stat-bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.stat-bar-track{height:7px;background:var(--surface2);border-radius:20px;overflow:hidden;border:1px solid var(--border);}
.stat-bar-fill{height:100%;border-radius:20px;transition:width .5s ease;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(43,170,224,.25);}
.btn-p:hover{background:var(--accent-d);transform:translateY(-1px);}
.btn-g{background:transparent;border:1.5px solid var(--border2);color:var(--text2);}
.btn-g:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#059669;}
.btn-export{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);transition:all .18s;}
.btn-export:hover{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.ib{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:8px;transition:all .15s;display:flex;align-items:center;}
.ib:hover{color:var(--accent);background:var(--accent-l);}
.ib.del:hover{color:var(--red);background:var(--red-bg);}

/* PHONE LINK */
a.tel-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;text-decoration:none;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--accent-l);border:1px solid var(--accent-l2);transition:all .15s;}
a.tel-link:hover{background:var(--accent);color:#fff;}

/* KANBAN */
.kb-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;}
.kb-wrap::-webkit-scrollbar{height:5px;}
.kb-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.kb-col{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;min-width:210px;width:210px;flex-shrink:0;transition:all .2s;}
.kb-col.drag-over{background:var(--accent-l);border-color:var(--accent-l2);}
.kb-col-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kb-col-title{font-size:12px;font-weight:700;}
.kb-count{background:var(--border2);color:var(--text2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;}
.kb-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px;cursor:grab;transition:all .18s;user-select:none;}
.kb-card:active{cursor:grabbing;}
.kb-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px);}
.kb-card.urgent{border-left:3px solid var(--red);}
.kb-card.warn{border-left:3px solid var(--orange);}
.kb-card.relance-sched{border-left:3px solid var(--orange);}
.kb-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.kb-meta{font-size:11px;color:var(--text3);display:flex;flex-direction:column;gap:3px;}
.kb-empty{text-align:center;padding:16px 0;color:var(--text3);font-size:11px;font-style:italic;}

/* PROD CARD */
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px;cursor:pointer;transition:all .18s;}
.prod-card:hover{box-shadow:var(--sh-md);border-color:var(--accent-l2);}
.prod-card.inactive{border-left:3px solid var(--red);}
.crit-chip{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10px;font-weight:600;color:var(--text2);}
.col-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}

/* LIST TABLE */
.list-table{width:100%;border-collapse:collapse;}
.list-table th{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:8px 12px;border-bottom:1.5px solid var(--border);text-align:left;}
.list-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);}
.list-table tr:last-child td{border-bottom:none;}
.list-table tr:hover td{background:var(--surface2);}
.td-name{color:var(--text);font-weight:700;}

/* VIEW TOGGLE */
.vt{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.vt-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text3);transition:all .15s;font-family:"Plus Jakarta Sans",sans-serif;}
.vt-btn.active{background:var(--accent);color:#fff;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px);}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);border:1px solid var(--border);}
.modal.wide{width:660px;}
.modal.xl{width:720px;}
.modal-title{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.03em;margin-bottom:18px;}
.modal-section{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 9px;padding-bottom:5px;border-bottom:1.5px solid var(--accent-l2);}

/* FORM */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.fi{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:9px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:500;outline:none;transition:all .18s;}
.fi:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-l);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

/* HISTORY */
.hist-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;}
.hist-text{font-size:12px;color:var(--text2);font-weight:500;}
.hist-date{font-size:10px;color:var(--text3);margin-top:1px;}

/* AGENDA */
.appt-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;align-items:flex-start;gap:12px;margin-bottom:9px;transition:all .18s;}
.appt-card:hover{box-shadow:var(--sh);border-color:var(--accent-l2);}
.appt-card.synced{border-left:3px solid var(--green);}
.appt-card.relance-card{border-left:3px solid var(--orange);background:var(--orange-l);}
.appt-card.today-card{border-color:var(--accent);background:var(--accent-l);}
.adb{background:var(--accent-l);border-radius:10px;padding:6px 9px;text-align:center;min-width:46px;border:1px solid var(--accent-l2);}
.adb.orange{background:var(--orange-bg);border-color:#FDE68A;}
.aday{font-size:21px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.03em;}
.adb.orange .aday{color:var(--orange);}

// ─── GCAL ──────────────────────────────────────────────────────────────────
const GCalSvc = {
  loaded: false,
  signed: false,
  async init() {
    return new Promise(res => {
      if (window.gapi) {
        res();
        return;
      }
      const s = document.createElement("script");
      s.src = "https://apis.google.com/js/api.js";
      s.onload = () => window.gapi.load("client:auth2", async () => {
        try {
          await window.gapi.client.init({
            apiKey: GCAL.API_KEY,
            clientId: GCAL.CLIENT_ID,
            discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
            scope: GCAL.SCOPES
          });
          GCalSvc.loaded = true;
          GCalSvc.signed = window.gapi.auth2.getAuthInstance().isSignedIn.get();
        } catch {}
        res();
      });
      document.head.appendChild(s);
    });
  },
  async signIn() {
    if (!GCalSvc.loaded) await GCalSvc.init();
    await window.gapi.auth2.getAuthInstance().signIn();
    GCalSvc.signed = true;
  },
  async create(appt, label) {
    if (!GCalSvc.signed) return null;
    const s = new Date(`${appt.date}T${appt.time}:00`),
      e = new Date(s.getTime() + appt.duration * 60000);
    const r = await window.gapi.client.calendar.events.insert({
      calendarId: GCAL.CALENDAR_ID,
      resource: {
        summary: appt.title,
        location: appt.location,
        description: appt.notes || label,
        start: {
          dateTime: s.toISOString(),
          timeZone: "Europe/Paris"
        },
        end: {
          dateTime: e.toISOString(),
          timeZone: "Europe/Paris"
        }
      }
    });
    return r.result.id;
  },
  async del(id) {
    if (GCalSvc.signed && id) await window.gapi.client.calendar.events.delete({
      calendarId: GCAL.CALENDAR_ID,
      eventId: id
    });
  }
};

// ─── CSV EXPORT ────────────────────────────────────────────────────────────
const exportCSV = (data, filename) => {
  if (!data.length) return;
  const keys = Object.keys(data[0]);
  const rows = [keys.join(";"), ...data.map(r => keys.map(k => JSON.stringify(r[k] ?? "", [], 0)).join(";"))];
  const blob = new Blob(["\uFEFF" + rows.join("\n")], {
    type: "text/csv;charset=utf-8;"
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
};

function App() {

    email: "",

      sectors: "",
      surfaceMin: "",
      moveDate: "",
      specific: "",
      profile: "",
      revenues: "",
      guarantor: ""
    }
  });

  const [dragOver, setDragOver] = useState(null);
  const [search, setSearch] = useState("");
  const [toasts, setToasts] = useState([]);

  // Inject CSS
  useEffect(() => {
    const el = document.createElement("style");
    el.setAttribute("data-soloc", "1");
    el.textContent = CSS;
    document.head.appendChild(el);
    return () => {
      document.head.removeChild(el);
    };

  const dragType = useRef(null);

    firstName: "",
    lastName: "",
    phone: "",
    email: "",
    source: "Site web",
    notes: ""

    clientId: "",
    title: "",
    date: "",
    time: "09:00",
    duration: 60,
    location: "",
    notes: ""
  };

  const [leadError, setLeadError] = useState("");

  // ── TOAST ──
  const addToast = useCallback((text, type = "success") => {
    const id = Date.now();
    setToasts(p => [...p, {
      id,
      text,
      type
    }]);
    setTimeout(() => setToasts(p => p.map(t => t.id === id ? {
      ...t,
      out: true
    } : t)), 3200);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3600);
  }, []);

  // ── PERSIST — storage first, seeds only if empty ──
  useEffect(() => {
    (async () => {
      const l = await storage.get("s6_leads");
      const c = await storage.get("s6_clients");
      const a = await storage.get("s6_appts");
      setLeads(l && l.length ? l : SEED_LEADS);
      setClients(c && c.length ? c : SEED_CLIENTS);
      setAppts(a && a.length ? a : SEED_APPOINTMENTS);
      setLoaded(true);
    })();
  }, []);
  useEffect(() => {
    if (loaded) storage.set("s6_leads", leads);
  }, [leads, loaded]);
  useEffect(() => {
    if (loaded) storage.set("s6_clients", clients);
  }, [clients, loaded]);
  useEffect(() => {
    if (loaded) storage.set("s6_appts", appts);
  }, [appts, loaded]);

  // ── BACKUP ──
  const doBackup = useCallback((manual = false) => {
    const data = {
      version: "s6",
      exportedAt: new Date().toISOString(),
      leads,
      clients,
      appts
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {
      type: "application/json"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().split("T")[0];
    a.href = url;
    a.download = "soloc-backup-" + date + ".json";
    a.click();
    URL.revokeObjectURL(url);
    storage.set("s6_lastBackup", new Date().toISOString());
    if (manual) addToast("💾 Sauvegarde téléchargée", "success");
  }, [leads, clients, appts]);
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      const last = await storage.get("s6_lastBackup");
      const lastDate = last ? new Date(String(last).replace(/"/g, "")) : null;
      const daysSinceLast = lastDate ? (Date.now() - lastDate.getTime()) / 86400000 : 999;
      if (daysSinceLast >= 7) {
        // Small delay so app is fully rendered first
        setTimeout(() => doBackup(false), 2000);
      }
    })();
  }, [loaded]);

  // ── ALERTS ──
  const la = getLeadAlerts(leads);
  const ca = getClientAlerts(clients);
  const totalAlerts = la.urgent.length + la.relance3Due.length + la.relance7Due.length + la.relance3Late.length + la.relance7Late.length + la.interestedDue.length + la.interestedLate.length + ca.length;
  const newLeads = leads.filter(l => l.column === "new").length;
  const todayRelances = appts.filter(a => a.isRelance && a.date === todayStr());
  const todayClientAppts = appts.filter(a => !a.isRelance && a.date === todayStr());
  const todayCount = todayRelances.length + todayClientAppts.length;

  // ── STATS ──
  const activeSearching = clients.filter(c => ["searching", "visit", "dossier"].includes(c.column)).length;
  const loggedThisMonth = clients.filter(c => ["signed", "paid"].includes(c.column) && hoursSince(c.enteredAt) <= 31 * 24).length;
  const pendingCA = clients.filter(c => c.column === "signed").length * 1200;
  const leadsThisWeek = leads.filter(l => l.column !== "lost" && hoursSince(l.enteredAt) <= 168).length;

  // ── CONVERSION STATS ──
  const convStats = ALL_SOURCES.map(src => {
    const total = leads.filter(l => l.source === src).length;
    const converted = clients.filter(c => c.notes?.includes(src) || leads.find(l => l.id === c.fromLeadId)?.source === src).length;
    const qualified = leads.filter(l => l.source === src && l.column === "qualified").length;
    return {
      src,
      total,
      qualified,
      rate: total > 0 ? Math.round(qualified / total * 100) : 0
    };
  }).filter(s => s.total > 0);

  // ── SEARCH FILTER ──
  const q = search.toLowerCase();
  const filteredLeads = leads.filter(l => l.name.toLowerCase().includes(q) || l.phone.includes(q) || l.email.toLowerCase().includes(q));
  const filteredClients = clients.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.email.toLowerCase().includes(q));

  // ── DRAG & DROP ──
  const onDragStart = (e, id, type) => {
    dragItem.current = id;
    dragType.current = type;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text", id + "|" + type);
  };
  const onDrop = async (e, col) => {
    e.preventDefault();
    setDragOver(null);
    if (!dragItem.current) {
      const data = e.dataTransfer.getData("text/plain");
      if (data) {
        const [id, type] = data.split("|");
        dragItem.current = id;
        dragType.current = type;
      }
    }
    if (!dragItem.current) return;
    if (dragType.current === "lead") {
      const lead = leads.find(l => l.id === dragItem.current);
      if (!lead) {
        dragItem.current = null;
        return;
      }
      if (lead.column === col) {
        dragItem.current = null;
        return;
      }
      let updatedLead = {
        ...lead,
        column: col
      };
      let newAppt = null;
      const today = fmtDDMMYYYY(nowISO());

      // Build history event based on destination
      let histEvent = null;
      if (col === "relance1") {
        histEvent = mkEvent("📞", "Appelé le " + today + " — pas de réponse");
      } else if (col === "relance2") {
        const r1Event = lead.history?.find(h => h.text.includes("Appelé le"));
        const r1Date = r1Event ? r1Event.text.match(/\d{2}\/\d{2}\/\d{4}/)?.[0] || today : today;
        histEvent = mkEvent("🔁", "Appel relance J+3 le " + r1Date + " — pas de réponse");
      } else if (col === "interested") {
        histEvent = mkEvent("🔥", "Intérêt confirmé le " + today + " — dossier envoyé");
        // Schedule a follow-up in 7 working days
        const targetDate = addWorkingDays(new Date(), 7);
        const time = findRelanceSlot(appts, targetDate);
        const apptId = "ri" + Date.now();
        newAppt = {
          id: apptId,
          clientId: null,
          leadId: lead.id,
          title: "🔥 Relance Chaud — " + lead.name,
          date: targetDate,
          time,
          duration: 5,
          location: "Téléphone",
          notes: lead.phone,
          gcalId: null,
          isRelance: true
        };
        updatedLead = {
          ...updatedLead,
          relanceDate: targetDate,
          relanceApptId: apptId
        };
        if (gcal) {
          try {
            const gid = await GCalSvc.create(newAppt, "Relance Chaud " + lead.name);
            newAppt = {
              ...newAppt,
              gcalId: gid
            };
          } catch {}
        }
        addToast("📅 Relance Chaud planifiée — " + fmtDate(targetDate).full + " à " + time, "orange");
      } else if (col === "qualified") {
        histEvent = mkEvent("✅", "Qualifié le " + today);
      } else if (col === "lost") {
        histEvent = mkEvent("❌", "Perdu le " + today);
      } else if (col === "new") {
        histEvent = mkEvent("↩️", "Remis en nouveau lead le " + today);
      }
      if (histEvent) updatedLead = {
        ...updatedLead,
        history: [...(lead.history || []), histEvent]
      };

      // Auto-schedule relance agenda
      if (col === "relance1" || col === "relance2") {
        const daysOff = col === "relance1" ? 3 : 7;
        const targetDate = addWorkingDays(new Date(), daysOff);
        if (lead.relanceApptId) {
          const old = appts.find(a => a.id === lead.relanceApptId);
          if (old?.gcalId) await GCalSvc.del(old.gcalId);
          setAppts(p => p.filter(a => a.id !== lead.relanceApptId));
        }
        const time = findRelanceSlot(appts, targetDate);
        const apptId = "ra" + Date.now();
        const label = col === "relance1" ? "Relance J+3" : "Relance J+7";
        newAppt = {
          id: apptId,
          clientId: null,
          leadId: lead.id,
          title: `📞 ${label} — ${lead.name}`,
          date: targetDate,
          time,
          duration: 5,
          location: "Téléphone",
          notes: lead.phone,
          gcalId: null,
          isRelance: true

        updatedLead = {
          ...updatedLead,
          relanceDate: targetDate,
          relanceApptId: apptId

          ...updatedLead,
          relanceDate: null,
          relanceApptId: null

      if (newAppt) setAppts(p => [...p, newAppt]);

      setClients(p => p.map(c => c.id === dragItem.current ? {

        lastActivity: nowISO()

  const connectGcal = async () => {
    try {
      await GCalSvc.signIn();
      setGcal(true);
      addToast("Google Calendar connecté ✓", "success");

      addToast("Connexion GCal échouée", "info");

  };

    if (!gcal) {
      addToast("Connectez Google Calendar d'abord", "info");
      return;

    const cl = clients.find(c => c.id === appt.clientId);

      const id = await GCalSvc.create(appt, cl?.name || "");

        ...a,
        gcalId: id
      } : a));
      addToast("✓ Synced dans Google Calendar", "success");
    } catch {
      addToast("Erreur GCal", "info");
    }

      setLeadError(!hasIdentity ? "Renseignez au moins un prénom ou un nom." : "Renseignez au moins un téléphone ou un email.");

    const fullName = [leadForm.firstName.trim(), leadForm.lastName.trim()].filter(Boolean).join(" ");
    const nl = {
      id: "l" + Date.now(),
      ...leadForm,
      name: fullName,
      enteredAt: nowISO(),
      column: "new",
      relanceDate: null,
      relanceApptId: null,
      history: [mkEvent("🌱", "Lead créé — source : " + leadForm.source)]
    };
    setLeads(p => [...p, nl]);
    setModal(null);
    setLeadForm(blankLead);
    setLeadError("");
    addToast("✓ Lead " + fullName + " ajouté", "success");
  };
  const saveAppt = () => {
    setAppts(p => [...p, {
      id: "a" + Date.now(),
      ...apptForm,
      duration: parseInt(apptForm.duration),
      gcalId: null,
      isRelance: false
    }]);
    setModal(null);
    setApptForm(blankAppt);
    addToast("✓ RDV créé", "success");
  };
  const saveFiche = () => {
    setClients(p => p.map(c => c.id === selectedClient.id ? {
      ...selectedClient,
      lastActivity: nowISO()
    } : c));
    setModal(null);
    addToast(`✓ Fiche ${selectedClient.name} enregistrée`, "success");
  };
  const deleteClient = id => {
    if (confirm("Supprimer ?")) setClients(p => p.filter(c => c.id !== id));
  };
  const deleteLead = async lead => {
    if (!confirm("Supprimer ?")) return;
    if (lead.relanceApptId) {
      const a = appts.find(x => x.id === lead.relanceApptId);
      if (a?.gcalId) await GCalSvc.del(a.gcalId);
      setAppts(p => p.filter(x => x.id !== lead.relanceApptId));
    }
    setLeads(p => p.filter(l => l.id !== lead.id));
  };
  const deleteAppt = async a => {
    if (!confirm("Supprimer ?")) return;
    if (a.gcalId) await GCalSvc.del(a.gcalId);
    if (a.leadId) setLeads(p => p.map(l => l.id === a.leadId ? {
      ...l,
      relanceApptId: null,
      relanceDate: null
    } : l));
    setAppts(p => p.filter(x => x.id !== a.id));
  };
  const leadUrgency = l => {
    const h = hoursSince(l.enteredAt);
    if (["lost", "qualified", "interested"].includes(l.column)) return null;
    if (h >= 48) return "red";
    if (h >= 24) return "orange";
    return null;
  };

  // ── ADD NEW CLIENT ──
  const addNewClient = () => {
    const nc = {
      id: "c" + Date.now(),
      name: "Nouveau client",
      phone: "",
      email: "",
      enteredAt: nowISO(),
      column: "searching",
      criteria: {
        type: "",
        budgetMax: "",
        sectors: "",
        surfaceMin: "",
        moveDate: "",
        specific: "",
        profile: "",
        revenues: "",
        guarantor: ""
      },
      notes: "",
      lastActivity: nowISO()
    };
    setClients(p => [...p, nc]);
    setSelectedClient(nc);
    setModal("fiche");
  };

  // ── EXPORT HELPERS ──
  const exportLeads = () => exportCSV(leads.map(l => ({
    Nom: l.name,
    Téléphone: l.phone,
    Email: l.email,
    Source: l.source,
    Statut: LEAD_COLS.find(c => c.id === l.column)?.label || l.column,
    Notes: l.notes
  })), "soloc_leads.csv");
  const exportClients = () => exportCSV(clients.map(c => ({
    Nom: c.name,
    Téléphone: c.phone,
    Email: c.email,
    Statut: PROD_COLS.find(x => x.id === c.column)?.label || c.column,
    Type: c.criteria.type,
    Budget: c.criteria.budgetMax,
    Secteurs: c.criteria.sectors,
    Profil: c.criteria.profile,
    Revenus: c.criteria.revenues,
    Notes: c.notes
  })), "soloc_clients.csv");

  // ── DRAG NATIF ────────────────────────────────────────────
  useEffect(() => {
