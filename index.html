<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOLOC' · CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --navy: #0D1F35; --blue: #3BB8F0; --light: #EBF0F5;
      --white: #FFFFFF; --red: #E05252; --green: #3BB88A;
      --amber: #F0A83B; --gray: #8A9BB0; --border: #D5E0EB;
      --font: 'Nunito', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--light); color: var(--navy); min-height: 100vh; }

    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px; background: var(--navy); padding: 24px 16px;
      display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
      position: fixed; top: 0; left: 0; height: 100vh;
    }
    .sidebar-logo { font-size: 22px; font-weight: 800; color: var(--white); letter-spacing: -0.5px; padding: 0 8px; margin-bottom: 24px; }
    .sidebar-logo span { color: var(--blue); }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.55);
      cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: var(--white); }
    .nav-item.active { background: var(--blue); color: var(--white); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-bottom { margin-top: auto; }

    .main { margin-left: 220px; flex: 1; padding: 32px; }
    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .page-sub { font-size: 14px; color: var(--gray); margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }

    /* LEADS */
    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .kanban-col { background: var(--white); border-radius: 12px; padding: 16px; }
    .col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .col-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .col-count { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
    .lead-card {
      background: var(--light); border-radius: 8px; padding: 12px; margin-bottom: 8px;
      cursor: pointer; transition: transform 0.15s; border: 1.5px solid transparent;
    }
    .lead-card:hover { transform: translateY(-1px); border-color: var(--blue); }
    .lead-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .lead-detail { font-size: 12px; color: var(--gray); }

    /* PARTENAIRES */
    .partners-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 220px; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: var(--font); font-size: 14px; color: var(--navy);
      outline: none; transition: border 0.2s; background: var(--white);
    }
    .search-input:focus { border-color: var(--blue); }

    .btn {
      padding: 10px 18px; border-radius: 8px; font-family: var(--font);
      font-size: 13px; font-weight: 700; cursor: pointer; border: none;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover { background: #1a3352; }
    .btn-outline { background: var(--white); color: var(--navy); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--navy); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-danger { background: #FDEAEA; color: var(--red); }
    .btn-danger:hover { background: var(--red); color: var(--white); }

    .table-wrap { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(13,31,53,0.07); }
    .table-head {
      display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 2fr 1.5fr 80px;
      padding: 11px 16px; background: var(--light);
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--gray); border-bottom: 1px solid var(--border);
    }
    .table-row {
      display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 2fr 1.5fr 80px;
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      align-items: center; transition: background 0.1s;
    }
    .table-row:last-child { border-bottom: none; }
    .table-row:hover { background: #F5F9FC; }
    .cell { font-size: 13px; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
    .cell-bold { font-weight: 700; }
    .cell-gray { color: var(--gray); }
    .cell-link { color: var(--blue); text-decoration: none; }
    .cell-link:hover { text-decoration: underline; }
    .cell-actions { display: flex; gap: 6px; justify-content: flex-end; padding-right: 0; }

    .empty { text-align: center; padding: 64px 20px; color: var(--gray); }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .empty-sub { font-size: 13px; }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0; background: rgba(13,31,53,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal { background: var(--white); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 800; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .form-input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font); font-size: 14px; color: var(--navy); outline: none; transition: border 0.2s; }
    .form-input:focus { border-color: var(--blue); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--navy); color: var(--white);
      padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 200;
      animation: fadeup 0.2s ease;
    }
    @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
    }
    .spinner-dark { border-color: rgba(13,31,53,0.15); border-top-color: var(--navy); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sync-badge {
      font-size: 11px; color: var(--gray); display: flex; align-items: center; gap: 5px;
    }
    .new-badge {
      background: #E2F7EF; color: #1A7A55; font-size: 10px; font-weight: 800;
      padding: 2px 6px; border-radius: 10px; animation: pulse 1s ease 2;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const API = 'https://script.google.com/macros/s/AKfycbyPQFA-DM8doJkjDp3oc8J9s-BFn2X6QQtaeshYkC1z5HwGkIVsflFl8vPh5kHXTchwlw/exec';

async function apiGet() {
  const res = await fetch(API);
  return res.json();
}
async function apiPost(data) {
  await fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
}

// ── PARTNER MODAL ──
function PartnerModal({ data, onSave, onClose, saving }) {
  const empty = { id: '', agence: '', nom: '', prenom: '', email: '', telephone: '' };
  const [f, setF] = useState(data || empty);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const submit = () => { if (!f.agence.trim() && !f.nom.trim()) return; onSave(f); };

  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && !saving && onClose()}>
      <div className="modal">
        <div className="modal-title">{data ? 'Modifier le contact' : 'Nouveau contact'}</div>
        <div className="form-group">
          <label className="form-label">Agence *</label>
          <input className="form-input" placeholder="Agence Foncia Lyon 7" value={f.agence}
            onChange={e => set('agence', e.target.value)} autoFocus disabled={saving} />
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Nom</label>
            <input className="form-input" placeholder="Martin" value={f.nom} onChange={e => set('nom', e.target.value)} disabled={saving} />
          </div>
          <div className="form-group">
            <label className="form-label">Prénom</label>
            <input className="form-input" placeholder="Sophie" value={f.prenom} onChange={e => set('prenom', e.target.value)} disabled={saving} />
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Email</label>
          <input className="form-input" type="email" placeholder="sophie.martin@foncia.com" value={f.email} onChange={e => set('email', e.target.value)} disabled={saving} />
        </div>
        <div className="form-group">
          <label className="form-label">Téléphone</label>
          <input className="form-input" placeholder="06 12 34 56 78" value={f.telephone}
            onChange={e => set('telephone', e.target.value)}
            onKeyDown={e => e.key === 'Enter' && submit()} disabled={saving} />
        </div>
        <div className="modal-actions">
          <button className="btn btn-outline" onClick={onClose} disabled={saving}>Annuler</button>
          <button className="btn btn-primary" onClick={submit} disabled={saving}>
            {saving ? <><span className="spinner" /> Envoi…</> : (data ? 'Enregistrer' : 'Ajouter →')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── PARTENAIRES PAGE ──
function PartenairesPage() {
  const [partners, setPartners] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [newIds, setNewIds] = useState(new Set());
  const prevIds = useRef(new Set());
  const pollTimer = useRef(null);
  const [toast, setToast] = useState('');
  const toastTimer = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2800);
  };

  const fetchData = async (silent = false) => {
    if (!silent) setLoading(true); else setSyncing(true);
    try {
      const data = await apiGet();
      const arr = Array.isArray(data) ? data : [];
      // detect new entries added by stagiaire
      const currentIds = new Set(arr.map(p => String(p.id)));
      const added = [...currentIds].filter(id => prevIds.current.size > 0 && !prevIds.current.has(id));
      if (added.length > 0) {
        setNewIds(new Set(added));
        showToast(`🆕 ${added.length} nouveau${added.length > 1 ? 'x' : ''} contact${added.length > 1 ? 's' : ''} ajouté${added.length > 1 ? 's' : ''} par le stagiaire`);
        setTimeout(() => setNewIds(new Set()), 5000);
      }
      prevIds.current = currentIds;
      setPartners(arr);
    } catch { if (!silent) showToast('❌ Erreur de connexion'); }
    finally { setLoading(false); setSyncing(false); }
  };

  useEffect(() => {
    fetchData();
    pollTimer.current = setInterval(() => fetchData(true), 8000);
    return () => clearInterval(pollTimer.current);
  }, []);

  const onSave = async (f) => {
    setSaving(true);
    const isNew = !f.id;
    const payload = { ...f, id: f.id || Date.now().toString(), action: isNew ? 'add' : 'update' };
    try {
      await apiPost(payload);
      setPartners(prev => isNew ? [...prev, payload] : prev.map(x => x.id === payload.id ? payload : x));
      prevIds.current.add(String(payload.id));
      setModal(null);
      showToast(isNew ? '✅ Contact ajouté' : '✅ Contact modifié');
      setTimeout(() => fetchData(true), 2000);
    } catch { showToast('❌ Erreur lors de l\'envoi'); }
    finally { setSaving(false); }
  };

  const onDelete = async (id) => {
    if (!window.confirm('Supprimer ce contact ?')) return;
    try {
      await apiPost({ action: 'delete', id });
      setPartners(prev => prev.filter(x => x.id !== id));
      prevIds.current.delete(String(id));
      showToast('🗑 Contact supprimé');
    } catch { showToast('❌ Erreur'); }
  };

  const exportCSV = () => {
    const headers = ['Agence', 'Nom', 'Prénom', 'Email', 'Téléphone'];
    const rows = partners.map(p => [p.agence, p.nom, p.prenom, p.email, p.telephone]);
    const csv = [headers, ...rows].map(r => r.map(v => `"${(v||'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `partenaires-soloc-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
    showToast('⬇ Export téléchargé');
  };

  const q = search.toLowerCase();
  const filtered = partners.filter(p =>
    !q || [p.agence, p.nom, p.prenom, p.email, p.telephone].some(v => (v||'').toLowerCase().includes(q))
  );

  return (
    <div>
      <div className="page-title">Partenaires</div>
      <div className="page-sub">
        Gestionnaires & commerciaux location à démarcher sur Lyon
        {syncing && <span className="sync-badge"><span className="spinner spinner-dark" /> sync…</span>}
      </div>

      <div className="partners-toolbar">
        <input className="search-input" placeholder="🔍  Rechercher agence, nom, email…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <button className="btn btn-outline" onClick={exportCSV}>⬇ Export CSV</button>
        <button className="btn btn-primary" onClick={() => setModal('new')}>+ Ajouter</button>
      </div>

      <div className="table-wrap">
        <div className="table-head">
          <div>Agence</div><div>Nom</div><div>Prénom</div>
          <div>Email</div><div>Téléphone</div><div></div>
        </div>

        {loading ? (
          <div className="empty">
            <div style={{ marginBottom: 12 }}><span className="spinner spinner-dark" style={{ width: 28, height: 28, borderWidth: 3 }} /></div>
            <div className="empty-title">Chargement…</div>
          </div>
        ) : filtered.length === 0 ? (
          <div className="empty">
            <div className="empty-icon">{partners.length === 0 ? '📋' : '🔍'}</div>
            <div className="empty-title">{partners.length === 0 ? 'Aucun contact encore' : 'Aucun résultat'}</div>
            <div className="empty-sub">{partners.length === 0 ? 'Clique sur "+ Ajouter" pour saisir ton premier contact.' : 'Essaie un autre mot-clé.'}</div>
          </div>
        ) : filtered.map(p => (
          <div className="table-row" key={p.id}>
            <div className="cell cell-bold">
              {p.agence || '—'}
              {newIds.has(String(p.id)) && <span className="new-badge" style={{ marginLeft: 6 }}>NEW</span>}
            </div>
            <div className="cell">{p.nom || '—'}</div>
            <div className="cell">{p.prenom || '—'}</div>
            <div className="cell">
              {p.email ? <a className="cell-link" href={`mailto:${p.email}`}>{p.email}</a> : <span className="cell-gray">—</span>}
            </div>
            <div className="cell cell-gray">{p.telephone || '—'}</div>
            <div className="cell cell-actions">
              <button className="btn btn-sm btn-outline" onClick={() => setModal(p)}>✏️</button>
              <button className="btn btn-sm btn-danger" onClick={() => onDelete(p.id)}>🗑</button>
            </div>
          </div>
        ))}
      </div>

      {modal && <PartnerModal data={modal === 'new' ? null : modal} onSave={onSave} onClose={() => setModal(null)} saving={saving} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// ── LEADS PAGE ──
const LEAD_COLS = [
  { id: 'hot',      label: '🔥 Chaud',     color: '#E05252', bg: '#FDEAEA' },
  { id: 'followup', label: '📞 Relance',    color: '#F0A83B', bg: '#FEF3E2' },
  { id: 'waiting',  label: '⏳ En attente', color: '#8A9BB0', bg: '#EBF0F5' },
  { id: 'lost',     label: '❌ Perdu',      color: '#CCD5E0', bg: '#F0F4F8' },
];
const LS = { get: (k,d) => { try { const v=localStorage.getItem('s7_'+k); return v?JSON.parse(v):d; } catch{return d;} }, set: (k,v) => { try{localStorage.setItem('s7_'+k,JSON.stringify(v));}catch{} } };

function LeadsPage() {
  const [leads, setLeads] = useState(() => LS.get('leads', [
    { id: '1', name: 'Amine', detail: 'T2, Villeurbanne', col: 'hot' },
    { id: '2', name: 'Chloé', detail: 'Studio, Lyon 3', col: 'followup' },
    { id: '3', name: 'Sandra', detail: 'T3, Décines', col: 'waiting' },
    { id: '4', name: 'Idriss', detail: 'T1, Lyon 8', col: 'lost' },
  ]));
  const [newName, setNewName] = useState({});
  useEffect(() => LS.set('leads', leads), [leads]);
  const move = (id, col) => setLeads(prev => prev.map(l => l.id === id ? { ...l, col } : l));
  const add = (col) => {
    const name = (newName[col]||'').trim(); if (!name) return;
    setLeads(prev => [...prev, { id: Date.now().toString(), name, detail: '', col }]);
    setNewName(n => ({ ...n, [col]: '' }));
  };
  return (
    <div>
      <div className="page-title">Leads clients</div>
      <div className="page-sub">Suivi des prospects chasseur locatif</div>
      <div className="kanban">
        {LEAD_COLS.map(col => {
          const colLeads = leads.filter(l => l.col === col.id);
          return (
            <div className="kanban-col" key={col.id}>
              <div className="col-header">
                <span className="col-title" style={{ color: col.color }}>{col.label}</span>
                <span className="col-count" style={{ background: col.bg, color: col.color }}>{colLeads.length}</span>
              </div>
              {colLeads.map(l => (
                <div className="lead-card" key={l.id}>
                  <div className="lead-name">{l.name}</div>
                  <div className="lead-detail">{l.detail}</div>
                  <div style={{ display:'flex', gap:4, marginTop:8, flexWrap:'wrap' }}>
                    {LEAD_COLS.filter(c => c.id !== col.id).map(c => (
                      <button key={c.id} onClick={() => move(l.id, c.id)}
                        style={{ fontSize:10, padding:'2px 7px', borderRadius:20, border:`1px solid ${c.color}20`, background:c.bg, color:c.color, cursor:'pointer', fontFamily:'Nunito' }}>
                        → {c.label.split(' ')[1]}
                      </button>
                    ))}
                  </div>
                </div>
              ))}
              <div style={{ display:'flex', gap:6, marginTop:4 }}>
                <input style={{ flex:1, padding:'6px 8px', border:'1.5px solid var(--border)', borderRadius:6, fontFamily:'Nunito', fontSize:12 }}
                  placeholder="Prénom…" value={newName[col.id]||''}
                  onChange={e => setNewName(n => ({ ...n, [col.id]: e.target.value }))}
                  onKeyDown={e => e.key === 'Enter' && add(col.id)} />
                <button className="btn btn-sm btn-primary" onClick={() => add(col.id)}>+</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── APP ROOT ──
const NAV = [
  { id: 'leads',       icon: '👥', label: 'Leads' },
  { id: 'partenaires', icon: '🤝', label: 'Partenaires' },
];

function App() {
  const [page, setPage] = useState('leads');
  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">SOLOC<span>'</span></div>
        {NAV.map(item => (
          <div key={item.id} className={`nav-item ${page === item.id ? 'active' : ''}`} onClick={() => setPage(item.id)}>
            <span className="nav-icon">{item.icon}</span>
            {item.label}
          </div>
        ))}
        <div className="sidebar-bottom">
          <div style={{ padding:'10px 12px', fontSize:11, color:'rgba(255,255,255,0.3)', lineHeight:1.4 }}>
            SOLOC' CRM · Charles<br/>
            <span style={{ color:'rgba(59,184,240,0.6)' }}>sync toutes les 8s</span>
          </div>
        </div>
      </div>
      <div className="main">
        {page === 'leads' && <LeadsPage />}
        {page === 'partenaires' && <PartenairesPage />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
